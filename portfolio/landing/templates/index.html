<!doctype html>
<html lang="en">
  <head>

    <title>{% block title %}{% endblock title %}</title>

 <body class="text-light" style="background: radial-gradient(circle, #00151f 0%, #083a4e 100%);">

                    <h2 class="fs-6 opacity-50">Backend developer</h2>
                    </div>
                    
    </div>
    <div class="container">
        <div class="row">

                    </div>
                </div>

        </div>
    </div>
    </div>

<div class="d-flex w-100 mt-5 justify-content-center" style="background-color: #0078a1;"">

</div>
